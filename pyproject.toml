[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tesseract-foundary"
version = "1.0.0"
description = "AI inference platform by Foundry AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.scripts]
"tesseract-foundry" = "tesseract_foundary.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
