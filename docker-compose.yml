version: "3.9"

services:
  tesseract-foundry:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./config.yaml:/app/config.yaml
      - ./model_registry:/app/model_registry
    environment:
      - TESSERACT_API_KEY=
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
